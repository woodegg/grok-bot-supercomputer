[Service]
Environment=TS_DEBUG_FIREWALL_MODE=nftables
ExecStartPre=/usr/local/libexec/tailscale-baseline check
ExecStart=
ExecStart=/usr/sbin/tailscaled --tun=tailscale0 --state=/var/lib/tailscale/tailscaled.state --statedir=/var/lib/tailscale --socket=/run/tailscale/tailscaled.sock --socks5-server=127.0.0.1:1055
ExecStartPost=/usr/local/libexec/tailscale-baseline apply
